<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Wania 🤍</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:'Poppins',sans-serif;

background:linear-gradient(-45deg,#0f172a,#172554,#312e81,#1e1b4b);

background-size:400% 400%;

animation:bg 14s ease infinite;

overflow-x:hidden;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

padding:20px;

color:white;

}

@keyframes bg{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}

.stars{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background-image:
radial-gradient(white 1px, transparent 1px);

background-size:40px 40px;

opacity:.4;

animation:moveStars 60s linear infinite;

z-index:-3;

}

@keyframes moveStars{

from{

transform:translateY(0);

}

to{

transform:translateY(-600px);

}

}

.flower{

position:fixed;

font-size:24px;

animation:fall linear infinite;

opacity:.8;

z-index:-2;

}

@keyframes fall{

0%{

transform:translateY(-120px) rotate(0deg);

}

100%{

transform:translateY(110vh) rotate(360deg);

}

}

.container{

width:100%;

max-width:760px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border-radius:28px;

padding:45px;

box-shadow:0 20px 60px rgba(0,0,0,.45);

border:1px solid rgba(255,255,255,.12);

text-align:center;

}

h1{

font-family:'Dancing Script',cursive;

font-size:60px;

margin-bottom:15px;

}

.subtitle{

font-size:20px;

opacity:.9;

margin-bottom:35px;

}

button{

padding:16px 35px;

border:none;

border-radius:50px;

font-size:18px;

cursor:pointer;

background:white;

transition:.35s;

}

button:hover{

transform:scale(1.08);

}
#letter{

display:none;

margin-top:45px;

text-align:left;

animation:fade .8s;

}

#letter h2{

font-family:'Dancing Script',cursive;

font-size:42px;

margin-bottom:25px;

text-align:center;

}

#typing{

font-size:19px;

line-height:2;

white-space:pre-wrap;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(35px);

}

to{

opacity:1;

transform:translateY(0);

}

}
  #loader{

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:#090c18;

display:flex;

justify-content:center;

align-items:center;

z-index:9999;

transition:1s;

}

.loader-text{

font-size:34px;

font-weight:bold;

animation:pulse 1.2s infinite;

}

@keyframes pulse{

0%{

opacity:.3;

transform:scale(.95);

}

50%{

opacity:1;

transform:scale(1.05);

}

100%{

opacity:.3;

transform:scale(.95);

}

}
</style>

</head>

<body>
  <div id="loader">
    <div class="loader-text">
        Loading...
    </div>
</div>

<div class="stars"></div>

<div class="flower" style="left:10%;animation-duration:13s;">🌸</div>

<div class="flower" style="left:25%;animation-duration:17s;">🌸</div>

<div class="flower" style="left:45%;animation-duration:15s;">🤍</div>

<div class="flower" style="left:65%;animation-duration:19s;">🌸</div>

<div class="flower" style="left:82%;animation-duration:16s;">🤍</div>

<div class="container">

<h1>

For Wania 🤍

</h1>

<div class="subtitle">

Some words are easier to write than to say...

</div>

  <button onclick="openLetter()">

🤍 Open My Heart

</button>

<div id="letter">

<h2>

Hi Wania...

</h2>

<p id="typing"></p>

</div>
</div>
<script>

const message=`Shayad tum soch rahi hogi...

ke website ki zarurat hi kya thi.

Sach kahun...

WhatsApp ke messages mein kabhi kabhi dil ki poori baat nahi aa pati.

Is liye socha...

is dafa kuch alag karun.

😊`;

function openLetter(){

document.getElementById("letter").style.display="block";

let i=0;

const typing=document.getElementById("typing");

typing.innerHTML="";

const timer=setInterval(()=>{

typing.innerHTML+=message.charAt(i);

i++;

if(i>=message.length){

clearInterval(timer);

}

},35);

window.scrollTo({

top:document.body.scrollHeight,

behavior:"smooth"

});

}
  window.onload=function(){

setTimeout(()=>{

document.getElementById("loader").style.opacity="0";

setTimeout(()=>{

document.getElementById("loader").style.display="none";

},1000);

},1800);

}

</script>
</body>

</html>

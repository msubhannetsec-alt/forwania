<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Wania 🤍</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

font-family:'Poppins',sans-serif;

background:
linear-gradient(-45deg,#020617,#172554,#312e81,#1e1b4b);

background-size:400% 400%;

animation:bg 15s ease infinite;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

color:white;

overflow-x:hidden;

}


@keyframes bg{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}



/* Loader */


#loader{

position:fixed;

width:100%;

height:100%;

background:#020617;

display:flex;

justify-content:center;

align-items:center;

z-index:9999;

transition:1s;

}


.loader-text{

font-size:35px;

font-weight:600;

animation:pulse 1.2s infinite;

}


@keyframes pulse{

50%{
transform:scale(1.1);
opacity:.5;
}

}



/* Stars */


.stars{

position:fixed;

inset:0;

background-image:
radial-gradient(white 1px,transparent 1px);

background-size:45px 45px;

opacity:.35;

animation:stars 50s linear infinite;

}


@keyframes stars{

from{
transform:translateY(0);
}

to{
transform:translateY(-500px);
}

}



/* Falling flowers */


.flower{

position:fixed;

top:-100px;

font-size:25px;

animation:fall linear infinite;

z-index:1;

}


@keyframes fall{

to{

transform:
translateY(120vh)
rotate(360deg);

}

}




.container{

width:100%;

max-width:800px;

background:rgba(255,255,255,.08);

backdrop-filter:blur(20px);

border-radius:30px;

padding:45px;

text-align:center;

border:1px solid rgba(255,255,255,.15);

box-shadow:
0 25px 70px rgba(0,0,0,.5);

position:relative;

z-index:2;

}




h1{

font-family:'Dancing Script';

font-size:65px;

margin-bottom:15px;

}



.subtitle{

font-size:20px;

opacity:.9;

margin-bottom:35px;

}




button{

padding:16px 40px;

border:none;

border-radius:50px;

font-size:18px;

cursor:pointer;

background:white;

color:#312e81;

font-weight:600;

transition:.4s;

}



button:hover{

transform:scale(1.08);

box-shadow:0 0 30px white;

}





.section{

display:none;

margin-top:40px;

animation:show 1s;

}




@keyframes show{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}




.card{

background:rgba(255,255,255,.1);

padding:35px;

border-radius:25px;

margin-top:30px;

line-height:2;

font-size:18px;

}




.card h2{

font-family:'Dancing Script';

font-size:45px;

margin-bottom:20px;

}





#typing{

font-size:19px;

line-height:2;

white-space:pre-wrap;

text-align:left;

}




.final{

font-family:'Dancing Script';

font-size:55px;

margin-top:30px;

}




.heart{

position:fixed;

font-size:20px;

animation:heart 8s linear infinite;

}


@keyframes heart{

from{

transform:translateY(100vh);

opacity:1;

}

to{

transform:translateY(-20vh);

opacity:0;

}

}



</style>

</head>


<body>



<div id="loader">

<div class="loader-text">

Loading... 🤍

</div>

</div>



<audio id="bgMusic" loop>

<source src="wania-songmp3.mp3" type="audio/mp3">

</audio>



<div class="stars"></div>


<div class="flower" style="left:10%;animation-duration:14s;">🌸</div>

<div class="flower" style="left:30%;animation-duration:18s;">🤍</div>

<div class="flower" style="left:55%;animation-duration:15s;">🌸</div>

<div class="flower" style="left:75%;animation-duration:20s;">🤍</div>




<div class="container">


<h1>

For Wania 🤍

</h1>


<div class="subtitle">

Some feelings are better written than spoken...

</div>



<button onclick="openHeart()">

🤍 Open My Heart

</button>




<div id="letter" class="section">


<h2 style="font-family:'Dancing Script';font-size:45px;">

Hi Wania...

</h2>


<p id="typing"></p>



<div id="continue1" style="display:none;margin-top:30px;">

<button onclick="cardOne()">

❤️ Continue

</button>

</div>



<div id="card1" class="section card"></div>


<div id="continue2" style="display:none;margin-top:30px;">

<button onclick="cardTwo()">

❤️ Continue

</button>

</div>



<div id="card2" class="section card"></div>


<div id="continue3" style="display:none;margin-top:30px;">

<button onclick="cardThree()">

❤️ Continue

</button>

</div>



<div id="card3" class="section card"></div>



<div id="surpriseBtn" style="display:none;margin-top:30px;">

<button onclick="surprise()">

🌸 Surprise

</button>

</div>



<div id="surprise" class="section card"></div>



<div id="lastBtn" style="display:none;margin-top:30px;">

<button onclick="lastThing()">

🤍 One Last Thing...

</button>

</div>



<div id="dua" class="section card"></div>



<div id="end" class="section">

<div class="final">

The End 🤍

</div>

</div>


</div>
<script>


window.onload=function(){

setTimeout(()=>{

document.getElementById("loader").style.opacity="0";

setTimeout(()=>{

document.getElementById("loader").style.display="none";

},1000);


},1800);


}




const message = `Shayad tum soch rahi hogi...

ke website ki zarurat hi kya thi.

Sach kahun...

WhatsApp ke messages mein kabhi kabhi dil ki poori baat nahi aa pati.

Is liye socha...

is dafa kuch alag karun.

😊`;





function openHeart(){


document.getElementById("bgMusic").play();


document.getElementById("letter").style.display="block";


let i=0;

let typing=document.getElementById("typing");


typing.innerHTML="";


let timer=setInterval(()=>{


typing.innerHTML += message.charAt(i);


i++;


if(i>=message.length){


clearInterval(timer);


document.getElementById("continue1").style.display="block";


}



},45);



window.scrollTo({

top:document.body.scrollHeight,

behavior:"smooth"

});


}





function cardOne(){


document.getElementById("card1").style.display="block";


document.getElementById("card1").innerHTML=`

<h2>3 Saal... 🌸</h2>

<p>

Sunne mein sirf ek number lagta hai.

<br><br>

Lekin meri zindagi mein...

ye 3 saal sirf waqt nahi thay.

<br><br>

Ye meri zindagi ke sab se khoobsurat chapters thay.

<br><br>

Har smile, har memory aur har moment mere liye special raha.

</p>

`;


document.getElementById("continue2").style.display="block";


scrollDown();


}






function cardTwo(){


document.getElementById("card2").style.display="block";


document.getElementById("card2").innerHTML=`

<h2>Ek Baat... 🤍</h2>

<p>

Main ye nahi kehta ke sab kuch perfect tha.

<br><br>

Hum dono se mistakes hui.

<br><br>

Lekin ek cheez hamesha real thi...

meri care aur meri feelings.

<br><br>

Tum meri life ka ek bohat important hissa ho.

</p>

`;


document.getElementById("continue3").style.display="block";


scrollDown();


}







function cardThree(){


document.getElementById("card3").style.display="block";


document.getElementById("card3").innerHTML=`

<h2>Meri Wish... ✨</h2>


<p>

Meri bas itni si wish hai...

<br><br>

ke hum dono hamesha ek dusre ko samajhne ki koshish karein.

<br><br>

Aur jo achi memories hain...

unko hamesha respect dein.

</p>

`;


document.getElementById("surpriseBtn").style.display="block";


scrollDown();


}







function surprise(){


document.getElementById("surprise").style.display="block";


document.getElementById("surprise").innerHTML=`

<h2>🌸 Surprise 🌸</h2>


<p>

Wania...

<br><br>

Agar ye website tumhare face par ek choti si smile bhi le aaye...

to mere liye ye kaafi hai.

<br><br>

Because some people are special...

and you are one of them.

🤍

</p>

`;


document.getElementById("lastBtn").style.display="block";


createHearts();


scrollDown();


}







function lastThing(){


document.getElementById("dua").style.display="block";


document.getElementById("dua").innerHTML=`

<h2>🤲 Dua</h2>


<p>

Allah tumhari zindagi mein hamesha khushiyan laaye.

<br><br>

Tumhari har mushkil asaan kare.

<br><br>

Tumhe sehat, sukoon aur kamyabi de.

<br><br>

Ameen 🤍

</p>


`;


document.getElementById("end").style.display="block";


scrollDown();


}








function scrollDown(){


setTimeout(()=>{


window.scrollTo({

top:document.body.scrollHeight,

behavior:"smooth"

});


},300);


}






function createHearts(){


for(let i=0;i<25;i++){


let heart=document.createElement("div");


heart.className="heart";


heart.innerHTML="🤍";


heart.style.left=Math.random()*100+"%";


heart.style.animationDuration=(5+Math.random()*5)+"s";


document.body.appendChild(heart);



}


}



</script>


</body>

</html>


</div>
